<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Contact</title>
<!-- NFC keychain contact card. The tag holds a link like  https://<you>.github.io/t/#n=Emma%20Smith&p=5145551234
     The name and phone ride in the part after # (never sent to any server); this one page shows them all. -->
<style>
  :root { --bg: #f3f1fb; --card: #ffffff; --tx: #1a1d2e; --mut: #6b6f85; --a1: #7c5cff; --a2: #ff5c8a; --btn: #1a1d2e; --btx: #fff; --line: #e6e3f3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12121a; --card: #1d1d29; --tx: #f1f0f7; --mut: #a3a2b8; --btn: #f1f0f7; --btx: #12121a; --line: #2c2c3c; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--tx); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; }
  .card { width: 100%; max-width: 360px; background: var(--card); border-radius: 28px; padding: 36px 24px 26px; text-align: center;
    box-shadow: 0 18px 50px rgba(60, 40, 140, .15); border: 1px solid var(--line); }
  .av { width: 112px; height: 112px; margin: 0 auto 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 50px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 10px 28px rgba(124, 92, 255, .35); }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.3px; word-break: break-word; }
  .ph { color: var(--mut); font-size: 18px; margin-bottom: 26px; letter-spacing: .3px; }
  .b { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border-radius: 16px; border: 0;
    font: 700 17px/1 inherit; font-family: inherit; text-decoration: none; cursor: pointer; margin-top: 10px; }
  .call { background: linear-gradient(135deg, var(--a1), var(--a2)); color: #fff; }
  .save { background: transparent; color: var(--tx); border: 2px solid var(--line); }
  .ft { margin-top: 22px; font-size: 12px; color: var(--mut); }
  .empty h1 { font-size: 22px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="av" id="av">📶</div>
  <h1 id="nm"></h1>
  <div class="ph" id="ph"></div>
  <a class="b call" id="call" href="#">📞 <span id="callT"></span></a>
  <button class="b save" id="save" type="button">👤 <span id="saveT"></span></button>
  <div class="ft" id="ft"></div>
</div>
<script>
(function () {
  var fr = /^fr/i.test(navigator.language || '');
  var T = fr ? { call: 'Appeler', save: 'Enregistrer le contact', ft: 'Porte-clés NFC', empty: 'Cette puce est vide', title: 'Contact' }
             : { call: 'Call', save: 'Save contact', ft: 'NFC keychain', empty: 'This tag is empty', title: 'Contact' };
  var q = {};
  (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) try { q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); } catch (e) {}
  });
  var name = (q.n || '').trim().slice(0, 60), tel = (q.p || '').replace(/[^\d+]/g, '').slice(0, 20);
  var $ = function (id) { return document.getElementById(id); };
  $('ft').textContent = T.ft;
  if (!name && !tel) {
    document.getElementById('card').className += ' empty';
    $('nm').textContent = T.empty; $('call').style.display = 'none'; $('save').style.display = 'none';
    return;
  }
  // phone shown as 514 555-1234 / +1 514 555-1234 when it looks North American
  var d = tel.replace(/\D/g, ''), pretty = tel;
  if (d.length === 10) pretty = d.slice(0, 3) + ' ' + d.slice(3, 6) + '-' + d.slice(6);
  else if (d.length === 11 && d[0] === '1') pretty = '+1 ' + d.slice(1, 4) + ' ' + d.slice(4, 7) + '-' + d.slice(7);
  document.title = name || T.title;
  $('nm').textContent = name;
  $('ph').textContent = pretty;
  var first = Array.from ? Array.from(name)[0] : name.charAt(0);
  $('av').textContent = first ? first.toUpperCase() : '📶';
  $('callT').textContent = T.call; $('saveT').textContent = T.save;
  if (tel) $('call').href = 'tel:' + tel; else $('call').style.display = 'none';
  $('save').addEventListener('click', function () {
    var esc = function (s) { return s.replace(/([,;\\])/g, '\\$1'); };
    var parts = name.split(/\s+/), last = parts.length > 1 ? parts.pop() : '', given = parts.join(' ');
    var v = 'BEGIN:VCARD\r\nVERSION:3.0\r\nFN:' + esc(name || pretty) + '\r\nN:' + esc(last) + ';' + esc(given) + ';;;\r\n' +
      (tel ? 'TEL;TYPE=CELL:' + tel + '\r\n' : '') + 'END:VCARD\r\n';
    var blob = new Blob([v], { type: 'text/vcard;charset=utf-8' }), url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = (name || 'contact').replace(/[^\w\- ]+/g, '') + '.vcf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  });
})();
</script>
</body>
</html>
